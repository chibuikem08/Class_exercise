<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="become-overlay">
        <div class="become-general">
            <div class="become-flex">
                <div class="become-home">
                <img src="icons/icons8-exterior-96.png" width="30"  height="30" alt="" srcset="" class="icon-img">
                </div>
                <div class="become-exp">
                    <img src="icons/icons8-exterior-96.png" width="30"  height="30" alt="" srcset="" class="icon-img">
                </div>
                <div class="become-service">
                    <img src="icons/icons8-exterior-96.png" width="30"  height="30" alt="" srcset="" class="icon-img">
                </div>
            </div>
            <button type="button" class="become-btn">Next</button>
        </div>
    </div>
    <form action="" class="general">
            <h3>Welcome to Airbnb</h3>
            <hr id="hr-1">
            <select name="" id="country">
                <option>Choose Country </option>
                <option value="USA" >America(+1)</option>
                <option value="ALB" >Albania(+355)</option>
                <option value="BNG">Bangadesh(+880)</option>
                <option value="CMR">Cameroon(+237)</option>
                <option value=" BHA">Bahamas(+2)</option>
                <option value=" EGY">Egypt(+20)</option>
                <option value="ETH" >Etheopia(+251)</option>
                <option value="FRC" >France(+33)</option>
                <option value="MOR" >Morocco(+212)</option>
                <option value="NGR" >Nigeria(+234)</option>
            </select>
            <input type="number" name="" id="phone" placeholder="Phone number">
            <p> We’ll call or text you to confirm your number. Standard message nad data routes apply.  <a href="#">Privacy Policy</a></p> 
           
            <div class="continue">
                continue
            </div>
            <div class="line-text">
                <hr>
                OR
                <hr>
            </div>
            <div class="google">
                continue with Google
            </div>
            <div class="apple">
                continue with Apple
            </div>
            <div class="facebook">
                continue with Facebook
            </div>
        </form>
</body>
</html>
